name: mini-sdp

# Three services, one shared SQLite state file, deployed on a single host.
#
# Two host directories are shared:
#   * state dir     - a HOST bind mount (SDP_STATE_DIR, default ./state) holding sdp.db
#                     (+ its -wal/-shm sidecars). All three processes mount it at /state;
#                     SQLite WAL coordinates them on this host. Bind-mounted so the .db is
#                     visible/backupable straight from the host (run on a Linux/WSL-native
#                     filesystem; WAL file locking over Docker Desktop's /mnt/c can be flaky).
#   * data dir      - a HOST bind mount at an *identical absolute path* on host and in the
#                     container. This alignment is required because the orchestrator launches
#                     the ska-sdp-mock as a sibling container via the host Docker daemon: the
#                     `-v <data>/obs-NNNN:/data` path it passes is resolved by the host, so
#                     that path must exist on the host, not just in-container.
#
# Set SDP_DATA_DIR to an absolute host path before `docker compose up`, e.g.
#   SDP_DATA_DIR=$PWD/data docker compose up --build
# (Docker creates the directories if they do not exist.)

x-app: &app
  build: .
  image: mini-sdp:latest
  restart: unless-stopped

services:
  orchestrator:
    <<: *app
    command:
      - mini-sdp
      - --db=/state/sdp.db
      - --data-dir=${SDP_DATA_DIR:-/srv/sdp/data}
      - --threshold=${SDP_THRESHOLD:-3221225472}  # 3 GiB default
      - --disk-margin=${SDP_DISK_MARGIN:-1073741824}  # 1 GiB default
      - --max-parallel=${SDP_MAX_PARALLEL:-2}
    volumes:
      - ${SDP_STATE_DIR:-./state}:/state
      - ${SDP_DATA_DIR:-/srv/sdp/data}:${SDP_DATA_DIR:-/srv/sdp/data}
      - /var/run/docker.sock:/var/run/docker.sock

  generator:
    <<: *app
    command:
      - mini-sdp-generate
      - --db=/state/sdp.db
      - --interval=${SDP_GEN_INTERVAL:-5}
    volumes:
      - ${SDP_STATE_DIR:-./state}:/state

  qa:
    <<: *app
    command:
      - mini-sdp-qa
      - --db=/state/sdp.db
      - --data-dir=${SDP_DATA_DIR:-/srv/sdp/data}
      - --host=0.0.0.0
      - --port=8000
    volumes:
      - ${SDP_STATE_DIR:-./state}:/state
      - ${SDP_DATA_DIR:-/srv/sdp/data}:${SDP_DATA_DIR:-/srv/sdp/data}
    ports:
      - "8000:8000"
